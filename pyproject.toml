[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quant-pipeline"
version = "0.2.0"
description = "Auditable research foundations for low-bit LLM calibration, attribution, allocation, and packing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Brandon M. Music"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
hf = ["accelerate>=1.0", "datasets>=4.0", "huggingface-hub>=0.27", "safetensors>=0.4", "sentencepiece>=0.2", "torch>=2.4", "transformers>=5.0"]
test = ["pytest>=8"]

[project.scripts]
quant-pipeline = "quant_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "quant_pipeline/THIRD_PARTY_NOTICES.md"
"THIRD_PARTY_LICENSES" = "quant_pipeline/THIRD_PARTY_LICENSES"
"CITATION.cff" = "quant_pipeline/CITATION.cff"
"configs" = "quant_pipeline/resources/configs"
"docs" = "quant_pipeline/resources/docs"
"environments" = "quant_pipeline/resources/environments"
"examples" = "quant_pipeline/resources/examples"
"scripts" = "quant_pipeline/resources/scripts"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSES",
  "/CITATION.cff",
  "/configs",
  "/docs",
  "/environments",
  "/examples",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
